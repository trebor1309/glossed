<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f8fafc; font-family: Arial, sans-serif; color: #0f172a">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #fff;
              border: 1px solid #e2e8f0;
              border-radius: 20px;
              padding: 32px;
            "
          >
            <tr>
              <td style="font-size: 24px; font-weight: 700; color: #e11d48">Glossed</td>
            </tr>
            <tr>
              <td><h1 style="margin: 28px 0 12px; font-size: 24px">Your verification code</h1></td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 24px; color: #475569">
                Enter this one-time code in Glossed to confirm this sensitive action:
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 0;
                  font-family: monospace;
                  font-size: 32px;
                  font-weight: 700;
                  letter-spacing: 8px;
                  color: #be123c;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 20px; color: #64748b">
                The code expires shortly. If you did not initiate this action, secure your account
                and contact Glossed support.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
