<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f8fafc; font-family: Arial, sans-serif; color: #0f172a">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #fff;
              border: 1px solid #e2e8f0;
              border-radius: 20px;
              padding: 32px;
            "
          >
            <tr>
              <td style="font-size: 24px; font-weight: 700; color: #e11d48">Glossed</td>
            </tr>
            <tr>
              <td>
                <h1 style="margin: 28px 0 12px; font-size: 24px">Your secure sign-in link</h1>
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 24px; color: #475569">
                Use this one-time link to sign in to Glossed. It expires shortly.
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 0">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    border-radius: 999px;
                    background: #e11d48;
                    color: #fff;
                    padding: 13px 22px;
                    text-decoration: none;
                    font-weight: 700;
                  "
                  >Sign in to Glossed</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 20px; color: #64748b">
                If you did not request this link, you can ignore this email. Never forward a sign-in
                link.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
